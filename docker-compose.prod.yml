# Production.  cp .env.production.example .env.production  → fill in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Add `--profile mysql` to also run MySQL in Docker (otherwise DATABASE_URL points at an existing server).
# Migrations run on every start (only new files in db/migrations are applied) before the app starts.
# Put the app behind the company reverse proxy / HTTPS (COOKIE_SECURE=true; the mic for voice chat needs HTTPS).
name: tbkk-pcw

services:
  app:
    build: { context: . }
    image: ${APP_IMAGE:-tbkk-pcw}:${APP_TAG:-latest}
    env_file: .env.production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    restart: always
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  migrate:
    build: { context: ., target: tools }
    image: ${APP_IMAGE:-tbkk-pcw}-tools:${APP_TAG:-latest}
    env_file: .env.production
    depends_on:
      mysql: { condition: service_healthy, required: false }
    restart: "no"
    logging: *logging

  # evidence files; the app reaches it as MINIO_ENDPOINT=minio, MINIO_PORT=9000
  minio:
    image: minio/minio:latest # pin a RELEASE.* tag once tested
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.production}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001" # console: local only (ssh tunnel)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging: *logging

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: always
    logging: *logging

volumes:
  minio-data:
  mysql-data:
