# Production.  cp .env.production.example .env.production  → fill in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Database = the company MySQL server (DATABASE_URL); no MySQL container.
# Migrations run on every start (only new files in db/migrations are applied) before the app starts.
# Put the app behind the company reverse proxy / HTTPS (COOKIE_SECURE=true; the mic for voice chat needs HTTPS).
name: tbkk-pcw

services:
  app:
    build: { context: . }
    image: ${APP_IMAGE:-tbkk-pcw}:${APP_TAG:-latest}
    env_file: .env.production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    restart: always
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  migrate:
    build: { context: ., target: tools }
    image: ${APP_IMAGE:-tbkk-pcw}-tools:${APP_TAG:-latest}
    env_file: .env.production
    restart: "no"
    logging: *logging

  # evidence files; the app reaches it as MINIO_ENDPOINT=minio, MINIO_PORT=9000
  minio:
    # minio/minio is no longer published; pgsty/minio is a community build of the same server
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.production}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001" # console: local only (ssh tunnel)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    logging: *logging

volumes:
  minio-data:
