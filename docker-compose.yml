# Local Docker.  Settings and secrets come from .env.local (MINIO_ACCESS_KEY / MINIO_SECRET_KEY, AUTH_SECRET, …).
#
# 1) Services only, app via `npm run dev` on the host:   npm run services:up
#      MinIO (evidence files)  API http://localhost:9100, console http://localhost:9101
#      Mailpit (e-mail)        UI  http://localhost:8025, SMTP 1025
#
# 2) Whole stack in Docker (profile "app": + MySQL, migrations, the app):   npm run docker:up
#      App   http://localhost:3000  (production build of the current source; APP_PORT=3010 to change)
#      MySQL localhost:3307  root / ${DOCKER_MYSQL_PASSWORD:-pcw}
#    Demo data:  npm run docker:seed      Logs:  npm run docker:logs      Stop:  npm run docker:down
#    Inside the containers DATABASE_URL / MINIO_* / SMTP_* point at the services below, whatever .env.local says.
x-app-env: &app-env
  DATABASE_URL: mysql://root:${DOCKER_MYSQL_PASSWORD:-pcw}@mysql:3306/tbkk_pcw
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  APP_URL: http://localhost:${APP_PORT:-3000}
  COOKIE_SECURE: "false"

services:
  minio:
    image: minio/minio:latest
    container_name: tbkk-pcw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.local}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Dev mail catcher (UI http://localhost:8025, SMTP 1025). Production: point SMTP_HOST to the company relay.
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    container_name: tbkk-pcw-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  mysql:
    profiles: [app]
    image: mysql:8.4
    container_name: tbkk-pcw-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_PASSWORD:-pcw}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DOCKER_MYSQL_PASSWORD:-pcw}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # applies db/migrations, then exits; `npm run docker:seed` reuses this image for demo data
  migrate:
    profiles: [app]
    build: { context: ., target: tools }
    image: tbkk-pcw-tools
    env_file: [{ path: .env.local, required: false }]
    environment:
      <<: *app-env
      NODE_ENV: development
    depends_on:
      mysql: { condition: service_healthy }

  app:
    profiles: [app]
    build: { context: . }
    image: tbkk-pcw
    container_name: tbkk-pcw-app
    env_file: [{ path: .env.local, required: false }]
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
      mailpit: { condition: service_started }
    restart: unless-stopped

volumes:
  minio-data:
  mysql-data:
