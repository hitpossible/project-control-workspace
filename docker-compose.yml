# Local Docker.  Settings and secrets come from .env.local (MINIO_ACCESS_KEY / MINIO_SECRET_KEY, AUTH_SECRET, …).
#
# 1) Services only, app via `npm run dev` on the host:   npm run services:up
#      MinIO (evidence files)  API http://localhost:9100, console http://localhost:9101
#      Mailpit (e-mail)        UI  http://localhost:8025, SMTP 1025
#
# 2) The app in Docker too (profile "app": migrations + the app):   npm run docker:up
#      App   http://localhost:3000  (production build of the current source; APP_PORT=3010 to change)
#      Realtime (live cursors on the Design tab)  ws://localhost:3001/realtime
#      Logs:  npm run docker:logs      Stop:  npm run docker:down
#    Database = MySQL on the host (MAMP), no MySQL container. 127.0.0.1 inside a container is the container itself, so
#    set DOCKER_DATABASE_URL in .env.local = DATABASE_URL with host.docker.internal, e.g.
#      DOCKER_DATABASE_URL=mysql://root:<password>@host.docker.internal:8889/tbkk_pcw
#    Inside the containers MINIO_* / SMTP_* point at the services below, whatever .env.local says.
x-app-env: &app-env
  DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env.local (DATABASE_URL with host.docker.internal instead of 127.0.0.1)}
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  APP_URL: http://localhost:${APP_PORT:-3000}
  COOKIE_SECURE: "false"

services:
  minio:
    # minio/minio is no longer published; pgsty/minio is a community build of the same server
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: tbkk-pcw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env.local}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Dev mail catcher (UI http://localhost:8025, SMTP 1025). Production: point SMTP_HOST to the company relay.
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    container_name: tbkk-pcw-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped


  # applies new db/migrations to the MAMP database, then exits
  migrate:
    profiles: [app]
    build: { context: ., target: tools }
    image: tbkk-pcw-tools
    env_file: [{ path: .env.local, required: false }]
    environment: *app-env

  # live cursors on the Design tab (WebSocket :3001); with `npm run dev` run `npm run realtime` instead
  realtime:
    profiles: [app]
    build: { context: ., target: realtime }
    image: tbkk-pcw-realtime
    container_name: tbkk-pcw-realtime
    env_file: [{ path: .env.local, required: false }]
    ports:
      - "3001:3001"
    restart: unless-stopped

  app:
    profiles: [app]
    build: { context: . }
    image: tbkk-pcw
    container_name: tbkk-pcw-app
    env_file: [{ path: .env.local, required: false }]
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
      mailpit: { condition: service_started }
    restart: unless-stopped

volumes:
  minio-data:
